{{- if .Values.ingress.enabled }}
{{- $issuer := include "porter-galaxy.clusterIssuer" . }}
{{- if and $issuer (not .Values.ingress.host) }}
{{- fail "ingress.tls.clusterIssuer needs ingress.host: a certificate is issued for a host name" }}
{{- end }}
{{- $tls := include "porter-galaxy.ingressTLS" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "porter-galaxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "porter-galaxy.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations $issuer }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $issuer }}
    cert-manager.io/cluster-issuer: {{ $issuer }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $tls }}
  tls:
    {{- $tls | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "porter-galaxy.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
