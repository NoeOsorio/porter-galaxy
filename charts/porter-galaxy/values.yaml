nameOverride: ""
fullnameOverride: ""

# Secrets used to pull images from a private registry (e.g. private GHCR).
# Example:
#   imagePullSecrets:
#     - name: ghcr-creds
imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/noeosorio/porter-galaxy-backend
    tag: ""   # defaults to Chart.appVersion; override with --set backend.image.tag=X.Y.Z
    pullPolicy: IfNotPresent
  port: 4000
  env:
    LOG_LEVEL: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: ghcr.io/noeosorio/porter-galaxy-frontend
    tag: ""   # defaults to Chart.appVersion; override with --set frontend.image.tag=X.Y.Z
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Both pods meet the Kubernetes "restricted" Pod Security Standard with these.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Built-in sign-in: one shared account. With no password and no existingSecret,
# a random password is generated on install and kept on upgrades; the install
# notes print how to read it.
auth:
  enabled: true
  username: admin
  password: ""
  # Use this Secret (keys `username` and `password`) instead of creating one.
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # HTTPS for `host` through cert-manager: set clusterIssuer to an existing
  # ClusterIssuer (e.g. letsencrypt-prod). `extra` takes standard Ingress tls
  # entries for other setups; a plain list here is still accepted.
  tls:
    clusterIssuer: ""
    extra: []
