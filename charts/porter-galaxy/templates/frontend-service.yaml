apiVersion: v1
kind: Service
metadata:
  name: {{ include "porter-galaxy.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "porter-galaxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "porter-galaxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
